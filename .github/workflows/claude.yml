# Issue / PR のコメントで `@claude` とメンションされたときに起動するworkflow
# Codex の `@codex` メンションと同じ使い方ができるようにするためのもの。
# 自動レビュー(claude-code-review.yml)は停止中で、こちらは手動メンション専用。
# https://docs.claude.com/ja/docs/claude-code/github-actions
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # `@claude` を含む本文のときだけ動かす(無関係なコメントで課金しないため)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # プロンプトを渡さない = メンションモード。コメント本文が指示になる
          claude_args: "--model claude-opus-5 --effort medium"
